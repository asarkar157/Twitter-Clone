services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '80'
    labels:
      shipyard.route: '/'
      shipyard.primary-route: true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - '3000'
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://twitter:twitter@postgres:5432/twitter_clone
      JWT_SECRET: ${JWT_SECRET}
    labels:
      shipyard.route: '/api'
      shipyard.init: node dist/db/init.js
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: twitter
      POSTGRES_PASSWORD: twitter
      POSTGRES_DB: twitter_clone
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twitter -d twitter_clone']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
