services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: twitter_clone
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://app:app@postgres:5432/twitter_clone
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3000'
    depends_on:
      - postgres
    labels:
      shipyard.route: '/api'

  frontend:
    build:
      context: ./frontend
    ports:
      - '80'
    depends_on:
      - backend
    labels:
      shipyard.route: '/'
      shipyard.primary-route: true

volumes:
  pgdata:
